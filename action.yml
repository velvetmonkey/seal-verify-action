# SPDX-License-Identifier: Apache-2.0
name: seal-verify
description: >-
  Authorise Seal decision receipts in CI: verifies the exact signed config,
  replays through the pinned audited kernel, and requires an independently
  provisioned operator public-key pin. Green always means authorised.
author: velvetmonkey

branding:
  icon: shield
  color: blue

inputs:
  receipts:
    description: >-
      Glob pattern(s) or newline-separated receipt paths, resolved under
      working-directory. Supports **, * and ? (no character classes).
    required: false
    default: "**/*.receipt.json"
  working-directory:
    description: Directory the receipt patterns are resolved against.
    required: false
    default: "."
  expected-config-pubkey:
    description: >-
      Required independently provisioned Ed25519 config-signer public key,
      exactly 64 lowercase hexadecimal characters. Never source this from the receipt.
    required: true
  verifier-version:
    description: >-
      Optional label echoed in the step summary next to the vendored verifier
      pin. Informational only; the verifier actually used is always the
      vendored, pinned copy.
    required: false
    default: ""

outputs:
  verified:
    description: Count of receipts authorised by the independently pinned signer.
  failed:
    description: >-
      Count of receipts that failed: NOT VERIFIED, NOT MEDIATED (bypass),
      verifier error, or a listed file that does not exist.
  signature_valid:
    description: True only when every matched receipt has a valid Ed25519 signed_config.
  kernel_replay_consistent:
    description: True only when every matched receipt replays byte-identically through df42.
  authority_trusted:
    description: True only when every signer matches expected-config-pubkey; otherwise false or unpinned.

runs:
  using: "node20"
  main: "dist/index.js"
