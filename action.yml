# SPDX-License-Identifier: Apache-2.0
name: seal-verify
description: >-
  Authorise Seal decision receipts in CI: verifies the exact signed config,
  replays every replay-applicable receipt through the pinned audited kernel,
  and requires an independently provisioned operator public-key pin. Green
  means every receipt verified against that pinned config and operator key —
  it authorises the receipts checked, not the surrounding system.
author: velvetmonkey

branding:
  icon: shield
  color: blue

inputs:
  receipts:
    description: >-
      Glob pattern(s) or newline-separated receipt paths, resolved under
      working-directory. Supports **, * and ? (no character classes).
    required: false
    default: "**/*.receipt.json"
  working-directory:
    description: Directory the receipt patterns are resolved against.
    required: false
    default: "."
  expected-config-pubkey:
    description: >-
      Required independently provisioned Ed25519 config-signer public key,
      exactly 64 lowercase hexadecimal characters. Never source this from the receipt.
    required: true
  verifier-version:
    description: >-
      Optional label echoed in the step summary next to the vendored verifier
      pin. Informational only; the verifier actually used is always the
      vendored, pinned copy.
    required: false
    default: ""

outputs:
  verified:
    description: >-
      Count of receipts independently verified by the pinned signer (full
      replay). Excludes reduced-scope (§11.1 authorised-unparseable) receipts.
  reduced_scope:
    description: >-
      Count of receipts at REDUCED SCOPE (schema §11.1 authorised-unparseable):
      the Ed25519-signed config and kernel-attested request binding verify, but
      the wire line is not re-parseable so no independent replay is possible —
      NOT independently verified. Counted within `failed`; the step never passes
      (exit 0) while this is nonzero.
  failed:
    description: >-
      Count of receipts that did not pass: NOT VERIFIED, NOT MEDIATED (bypass),
      verifier error, a listed file that does not exist, OR at reduced scope
      (§11.1, also counted in reduced_scope). A gate keying on `failed == 0`
      fails closed on reduced-scope receipts.
  signature_valid:
    description: True only when every matched receipt has a valid Ed25519 signed_config.
  kernel_replay_consistent:
    description: >-
      True only when at least one matched receipt is replay-applicable AND
      every replay-applicable receipt replays byte-identically through df42.
      Unparseable-request receipts (schema §11.1) carry no (tool, arguments),
      are out of replay scope rather than replay failures, and verify at
      raw-line-identity scope instead. Read this together with
      kernel_replay_scope: a set with nothing replayable reports false, never
      a vacuous true.
  kernel_replay_scope:
    description: >-
      Replay coverage as "applicable/matched" (e.g. "3/4"): how many of the
      matched receipts kernel_replay_consistent actually replayed. "0/N" means
      nothing was replayable.
  authority_trusted:
    description: True only when every signer matches expected-config-pubkey; otherwise false or unpinned.

runs:
  using: "node20"
  main: "dist/index.js"
