# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the tag to identify this exact commit
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Run the release gate
        run: |
          npm test
          npm run check:pins
          node scripts/claims-drift.mjs
          test -z "$(git status --porcelain)"
      - name: Build the reproducible Action distribution archive and evidence
        run: scripts/build-release.sh seal-verify-action "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'This release provides a reproducible source/distribution archive of seal-verify-action, including the committed `dist/index.js` used by GitHub Actions.' \
            '' \
            'It is not a newly compiled binary, an npm-registry publication, or proof that the Action or its vendored verifier is bug-free. See `SHA256SUMS` for the archive digest and `SEAL-RELEASE-PROVENANCE.json` for the workflow run, commit, and builder record. The conventional floating `v1` consumer tag is promoted separately only after this immutable release succeeds.' > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/seal-verify-action-$GITHUB_REF_NAME.tar.gz" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json" \
            --verify-tag --title "seal-verify-action $GITHUB_REF_NAME" --notes-file "$notes"
