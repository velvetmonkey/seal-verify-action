# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # matches the action's node20 runtime
          node-version: '20'
      - run: node --check dist/index.js
      - run: npm test
      - name: npm test must not mutate tracked files
        run: |
          test -z "$(git status --porcelain)"
      - name: vendored files must match VENDORED.md pins
        run: npm run check:pins
