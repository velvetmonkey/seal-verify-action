# SPDX-License-Identifier: Apache-2.0
name: selftest
on:
  push:
  pull_request:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: pass fixtures verify
        id: pass
        uses: ./
        with:
          receipts: fixtures/pass/**/*.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      - name: assert pass outputs
        run: |
          test "${{ steps.pass.outputs.verified }}" = "3"
          test "${{ steps.pass.outputs.reduced_scope }}" = "0"
          test "${{ steps.pass.outputs.failed }}" = "0"
          test "${{ steps.pass.outputs.kernel_replay_consistent }}" = "true"
          test "${{ steps.pass.outputs.kernel_replay_scope }}" = "3/3"

      - name: unparseable-request receipt is REDUCED SCOPE — never verified, step fails
        id: unparseable
        uses: ./
        continue-on-error: true
        with:
          receipts: fixtures/reduced/unparseable.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      - name: assert unparseable outputs
        run: |
          test "${{ steps.unparseable.outcome }}" = "failure"
          test "${{ steps.unparseable.outputs.verified }}" = "0"
          test "${{ steps.unparseable.outputs.reduced_scope }}" = "1"
          test "${{ steps.unparseable.outputs.failed }}" = "1"
          test "${{ steps.unparseable.outputs.kernel_replay_consistent }}" = "false"
          test "${{ steps.unparseable.outputs.kernel_replay_scope }}" = "0/1"

      - name: forged request pairing must fail the step (kernel-attested binding)
        id: forged
        uses: ./
        continue-on-error: true
        with:
          receipts: fixtures/fail/forged-binding.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      - name: assert forged pairing failed
        run: |
          test "${{ steps.forged.outcome }}" = "failure"
          test "${{ steps.forged.outputs.verified }}" = "0"
          test "${{ steps.forged.outputs.failed }}" = "1"

      - name: bypass receipt must fail the step
        id: bypass
        uses: ./
        continue-on-error: true
        with:
          receipts: fixtures/fail/bypass.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      - name: assert bypass failed
        run: |
          test "${{ steps.bypass.outcome }}" = "failure"
          test "${{ steps.bypass.outputs.verified }}" = "0"
          test "${{ steps.bypass.outputs.failed }}" = "1"

      - name: zero matches must fail closed
        id: nomatch
        uses: ./
        continue-on-error: true
        with:
          receipts: no/such/dir/**/*.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      - name: assert nomatch failed closed
        run: |
          test "${{ steps.nomatch.outcome }}" = "failure"

      - name: missing pin is authentic but unpinned and fails
        id: unpinned
        uses: ./
        continue-on-error: true
        with:
          receipts: fixtures/pass/**/*.receipt.json
      - name: assert unpinned failed honestly
        run: |
          test "${{ steps.unpinned.outcome }}" = "failure"
          test "${{ steps.unpinned.outputs.signature_valid }}" = "true"
          test "${{ steps.unpinned.outputs.kernel_replay_consistent }}" = "true"
          test "${{ steps.unpinned.outputs.authority_trusted }}" = "unpinned"

      - name: working-directory and newline multi-pattern
        id: wd
        uses: ./
        with:
          working-directory: fixtures
          receipts: |
            pass/**/*.receipt.json
            fail/bypass.receipt.json
          expected-config-pubkey: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
        continue-on-error: true
      - name: assert wd outputs
        run: |
          test "${{ steps.wd.outcome }}" = "failure"
          test "${{ steps.wd.outputs.verified }}" = "3"
          test "${{ steps.wd.outputs.failed }}" = "1"

      - name: verify and physically tamper with a real receipt
        run: node scripts/windows-e2e.cjs e2e-verdict.json
      - name: upload deterministic e2e verdict
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-verdict.json

  compare-e2e:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: e2e-results
          merge-multiple: false
      - run: node scripts/compare-e2e.cjs e2e-results/e2e-ubuntu-latest/e2e-verdict.json e2e-results/e2e-windows-latest/e2e-verdict.json
